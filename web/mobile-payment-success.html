<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Payment Successful — Gourmet AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1628;
      --card: rgba(15, 42, 61, 0.92);
      --green: #2dd4bf;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0f2a3d 50%, #0a1628 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid rgba(45, 212, 191, 0.25);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(45, 212, 191, 0.15);
      border: 2px solid rgba(45, 212, 191, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      line-height: 1;
      color: var(--green);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.98rem;
    }

    .note {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(45, 212, 191, 0.08);
      border: 1px solid rgba(45, 212, 191, 0.2);
      color: var(--text);
      font-size: 0.92rem;
      text-align: left;
    }

    .actions {
      margin-top: 28px;
      display: grid;
      gap: 12px;
    }

    button, .btn {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: block;
      width: 100%;
    }

    .primary {
      background: var(--green);
      color: #0a1628;
    }

    .secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>
    <h1>Payment Successful</h1>
    <p>Your subscription is being activated. Return to the Gourmet AI app to continue.</p>
    <div class="note">
      Switch back to Gourmet AI — your premium access will be ready in a few seconds.
    </div>
    <div class="actions">
      <a id="open-app" class="btn primary" href="#">Open Gourmet AI App</a>
      <button id="close-page" class="secondary" type="button">Close this page</button>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var deepLink = 'gourmetai://payment/success';
      if (params.toString()) {
        deepLink += '?' + params.toString();
      }

      var openApp = document.getElementById('open-app');
      var closePage = document.getElementById('close-page');

      openApp.href = deepLink;

      openApp.addEventListener('click', function (event) {
        event.preventDefault();
        window.location.href = deepLink;
      });

      closePage.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.close();
      });

      // Attempt to reopen the native app shortly after redirect from Dodo Payments.
      setTimeout(function () {
        window.location.href = deepLink;
      }, 600);
    })();
  </script>
</body>
</html>
