  <!--
    Favicons — same-origin static files are the source of truth for Google
    Search and first paint. Google requires a crawlable, same-domain icon; it
    does not reliably use cross-origin Firebase Storage URLs from JS.
    After an admin upload, run tools/sync_favicons_from_firebase.ps1 then
    redeploy so these files match app_assets/favicon.png in Storage.
    FaviconService (Dart) may still hot-swap the tab icon at runtime until
    the next deploy syncs the static bundle.
  -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="icon" type="image/png" sizes="16x16"  href="/favicon-16.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="48x48"  href="/favicon-48.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/Icon-512.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">

  <!--
    Service-worker reset only. Do NOT replace the static <link rel="icon">
    tags above — Google's crawler reads them (and /favicon.ico) before JS
    runs, and same-origin icons are required for search-result favicons.
  -->
  <script>
    (function () {
      var URL_KEY  = 'app_favicon_url_v1';
      var VER_KEY  = 'app_favicon_version_v1';

      // Wipe stale Flutter service workers + their caches.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          }).catch(function(){});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          }).catch(function(){});
        }
      } catch (_) {}

      // Seed localStorage for FaviconService (Dart) without touching DOM icons.
      try {
        fetch(
          'https://firestore.googleapis.com/v1/projects/gourmetai-c432b/databases/(default)/documents/admin_settings/app_settings',
          { cache: 'no-store' }
        ).then(function (res) {
          if (!res.ok) return null;
          return res.json();
        }).then(function (doc) {
          if (!doc || !doc.fields) return;
          var ts = doc.fields.faviconUpdatedAt;
          var url = doc.fields.faviconUrl;
          var newVer = (ts && (ts.timestampValue || ts.integerValue)) ||
                       (url && url.stringValue) || null;
          if (!newVer) return;
          try { localStorage.setItem(VER_KEY, String(newVer)); } catch (_) {}
          if (url && url.stringValue) {
            try { localStorage.setItem(URL_KEY, url.stringValue); } catch (_) {}
          }
        }).catch(function () {});
      } catch (_) {}
    })();
  </script>

  <title>Food Genius AI - AI-Powered Recipe Generation</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A1628;
      font-family: 'Inter', sans-serif;
    }

    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0A1628;
      z-index: 999;
      transition: opacity 0.3s ease;
    }

    .splash-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #2DD4BF;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
    }

    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(45, 212, 191, 0.15);
      border-top-color: #2DD4BF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Branded splash shown instantly while Flutter loads -->
  <div id="splash" class="splash">
    <div class="splash-title">FoodGeniusAI</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine({
          renderer: "html",
        });
        await appRunner.runApp();
        // Hide splash once Flutter has painted
        const splash = document.getElementById("splash");
        if (splash) splash.style.opacity = "0";
        setTimeout(() => { if (splash) splash.remove(); }, 300);
      }
    });
  </script>
</body>
</html>
